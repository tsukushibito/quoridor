[project]
name = "quoridor"
version = "0.1.0"
description = "Shared Quoridor control, training, analysis and quality environment"
requires-python = "==3.14.7"
dependencies = [
  "torch==2.14.0+cu130",
  "numpy==2.5.3",
  "onnx==1.23.0",
  "onnxruntime==1.30.0",
  "onnxscript==0.7.2",
  "matplotlib==3.11.2",
  "websockets==17.1",
]

[dependency-groups]
dev = ["ruff==0.13.1"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# Preserve every installed numerical/transitive dependency at this migration.
constraint-dependencies = [
  "contourpy==1.4.0",
  "cuda-bindings==13.4.3",
  "cuda-pathfinder==1.8.2",
  "cuda-toolkit==13.0.3.0",
  "cycler==0.12.1",
  "filelock==4.0.6",
  "flatbuffers==25.12.19",
  "fonttools==4.66.1",
  "fsspec==2026.9.0",
  "jinja2==3.1.6",
  "kiwisolver==1.5.1",
  "markupsafe==3.0.3",
  "matplotlib==3.11.2",
  "ml-dtypes==0.6.0",
  "mpmath==1.3.0",
  "networkx==3.7",
  "numpy==2.5.3",
  "nvidia-cublas==13.1.1.3",
  "nvidia-cuda-cupti==13.0.85",
  "nvidia-cuda-nvrtc==13.0.88",
  "nvidia-cuda-runtime==13.0.96",
  "nvidia-cudnn-cu13==9.24.0.43",
  "nvidia-cufft==12.0.0.61",
  "nvidia-cufile==1.15.1.6",
  "nvidia-curand==10.4.0.35",
  "nvidia-cusolver==12.0.4.66",
  "nvidia-cusparse==12.6.3.3",
  "nvidia-cusparselt-cu13==0.8.1",
  "nvidia-nccl-cu13==2.30.7",
  "nvidia-nvjitlink==13.4.92",
  "nvidia-nvshmem-cu13==3.4.5",
  "nvidia-nvtx==13.0.85",
  "onnx==1.23.0",
  "onnx-ir==1.0.0",
  "onnxruntime==1.30.0",
  "onnxscript==0.7.2",
  "packaging==26.3",
  "pillow==12.3.0",
  "protobuf==7.36.2",
  "pyparsing==3.3.3",
  "python-dateutil==2.9.0.post0",
  "ruff==0.13.1",
  "setuptools==84.0.0",
  "six==1.17.0",
  "sympy==1.14.0",
  "torch==2.14.0+cu130",
  "triton==3.8.0",
  "typing-extensions==4.16.0",
  "websockets==17.1",
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cuda" }
