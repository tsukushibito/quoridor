[package]
name = "ai-sigma-inference-probe"
version = "0.1.0"
edition = "2021"
[workspace]
[lib]
crate-type = ["rlib", "cdylib"]
[dependencies]
tract-onnx = { version = "=0.22.3", default-features = false }
serde_json = "=1.0.145"
[profile.dev]
debug = 0
incremental = false
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.2.17", features = ["custom"] }
