[package]
name="ai-sigma-ort-search"
version="0.1.0"
edition="2021"
[workspace]
[lib]
crate-type=["rlib","cdylib"]
[features]
default=["research","research-diagnostics"]
research=[]
research-diagnostics=["research"]
profiling=["quoridor-core/profiling"]
[dependencies]
quoridor-core={path="../../../crates/quoridor-core",features=["research-diagnostics"]}
quoridor-ai={path="../../../crates/quoridor-ai",features=["research-diagnostics"]}
serde_json="=1.0.145"
[profile.release]
opt-level=3
debug=0
lto=false
codegen-units=16
incremental=false
[profile.dev]
debug=0
incremental=false
