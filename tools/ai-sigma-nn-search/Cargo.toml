[package]
name="ai-sigma-nn-search"
version="0.1.0"
edition="2021"
[workspace]
[lib]
crate-type=["rlib","cdylib"]
[dependencies]
ai-sigma-inference-release={path="../ai-sigma-inference-release"}
quoridor-core={path="../../crates/quoridor-core",features=["research-diagnostics"]}
quoridor-ai={path="../../crates/quoridor-ai",features=["research-diagnostics"]}
serde_json="=1.0.145"
[profile.release]
opt-level=3
debug=0
lto=false
codegen-units=16
incremental=false
[profile.dev]
debug=0
incremental=false
