<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>研究状況のスナップショット</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        color: #172c3d;
        background: #edf2f5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      main {
        max-width: 1240px;
        margin: auto;
        padding: 28px;
      }
      h1 {
        font-size: 1.7rem;
        margin: 0 0 8px;
      }
      .owner-row > span {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      p {
        line-height: 1.5;
      }
      .muted {
        color: #526675;
        font-size: 0.9rem;
      }
      .counts {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin: 24px 0;
      }
      .count {
        background: white;
        border: 1px solid #cedbe3;
        border-radius: 10px;
        padding: 14px 22px;
      }
      .count strong {
        display: block;
        font-size: 1.6rem;
      }
      .controls {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        align-items: center;
        margin: 20px 0;
      }
      input[type='search'] {
        min-width: 210px;
        padding: 10px;
        border: 1px solid #9eafbc;
        border-radius: 6px;
      }
      button {
        padding: 8px 12px;
        border: 1px solid #8a9fac;
        border-radius: 6px;
        background: white;
        color: #172c3d;
        cursor: pointer;
      }
      button:focus-visible,
      summary:focus-visible,
      input:focus-visible {
        outline: 3px solid #2872ae;
        outline-offset: 3px;
      }
      .head,
      .owner-row {
        display: grid;
        grid-template-columns:
          minmax(170px, 1.1fr) minmax(180px, 1.15fr) minmax(220px, 1.5fr)
          minmax(220px, 1.5fr);
        gap: 14px;
        align-items: center;
      }
      .head {
        padding: 10px 18px;
        color: #526675;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .owner-row {
        width: 100%;
        text-align: left;
        border: 1px solid #c9d7e0;
        border-radius: 10px;
        background: white;
        margin: 5px 0;
        padding: 12px 16px;
        cursor: pointer;
      }
      .owner-row:hover {
        background: #f5f8fa;
      }
      .owner-name {
        font-weight: 600;
      }
      .label {
        display: block;
        color: #526675;
        font-size: 0.8rem;
        margin-bottom: 4px;
      }
      .badge {
        display: inline-block;
        padding: 3px 8px;
        margin: 2px 4px 4px 0;
        border-radius: 5px;
        background: #e9eef2;
        font-size: 0.85rem;
      }
      .running,
      .active {
        background: #d8efe2;
        color: #1e593c;
      }
      .waiting,
      .paused {
        background: #fff0c5;
        color: #6b4b0b;
      }
      .error {
        background: #fce0dc;
        color: #8b3228;
      }
      .issue {
        padding: 16px 0;
        border-top: 1px solid #e0e7ed;
        overflow-wrap: anywhere;
      }
      dt {
        color: #526675;
      }
      dd {
        margin: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .job {
        border-left: 3px solid #9bb0be;
        padding: 8px 14px;
        margin: 14px 0;
      }
      .path {
        display: flex;
        gap: 8px;
        margin: 8px 0;
      }
      .path input {
        min-width: 0;
        width: 100%;
        padding: 8px;
        font-family: monospace;
        border: 1px solid #c9d7e0;
        background: #f5f8fa;
      }
      #warnings {
        padding: 0;
        list-style: none;
      }
      #warnings li {
        border-left: 3px solid #a67817;
        background: #fff5db;
        padding: 10px 14px;
        margin: 8px 0;
        overflow-wrap: anywhere;
      }
      #empty {
        padding: 30px;
        text-align: center;
        color: #526675;
      }
      [hidden] {
        display: none !important;
      }
      #session-dialog {
        width: min(960px, 90vw);
        max-height: 86vh;
        border: 1px solid #a7bdca;
        border-radius: 12px;
        padding: 20px 26px;
        color: #172c3d;
        background: white;
        overflow: auto;
      }
      #session-dialog::backdrop {
        background: #172c3dbb;
      }
      .dialog-head {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 18px;
        position: sticky;
        top: -20px;
        background: white;
        padding: 8px 0;
        border-bottom: 1px solid #d8e1e7;
      }
      .dialog-head h2 {
        margin: 0;
      }
      .detail-section {
        padding: 12px 0;
        border-bottom: 1px solid #d8e1e7;
      }
      .detail-section h3 {
        margin: 8px 0;
      }
      .detail-section dl {
        display: grid;
        grid-template-columns: 150px minmax(0, 1fr);
        gap: 8px 14px;
      }
      .original pre {
        max-height: 260px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>研究状況のスナップショット</h1>
      <p id="timestamp" class="count" role="status"></p>
      <p id="loaded-at" class="muted"></p>
      <p class="muted">
        LLMの活動と実際の計算ジョブは別の状態です。終了コード0や管理上の完了は、研究結果の成功を意味しません。
      </p>
      <div id="counts" class="counts" aria-label="生成時点の件数"></div>
      <p id="translation-status" class="muted" role="status"></p>
      <ul id="warnings" aria-label="情報源の警告"></ul>
      <div class="controls">
        <label for="search">担当者・タスクを検索</label>
        <input id="search" type="search" placeholder="日本語説明・ID・担当者・次の作業" />
        <label><input id="waiting" type="checkbox" /> 待機中のタスクのみ</label>
        <button id="reload" type="button">このファイルを再読み込み</button>
      </div>
      <div class="head" aria-hidden="true">
        <span>担当者・セッション</span><span>根拠のある活動</span><span>主な現在のタスク</span
        ><span>次の作業・待機理由</span>
      </div>
      <div id="owners"></div>
      <p id="empty" hidden>検索条件に一致する担当者はいません。</p>
      <p id="copy-status" class="muted" role="status"></p>
    </main>
    <dialog id="session-dialog" aria-labelledby="dialog-title">
      <div class="dialog-head">
        <h2 id="dialog-title"></h2>
        <button id="dialog-close" type="button">閉じる</button>
      </div>
      <div id="dialog-content"></div>
    </dialog>
    <script id="snapshot" type="application/json">
      __SNAPSHOT_JSON__
    </script>
    <script>
      'use strict';
      const snapshot = JSON.parse(document.getElementById('snapshot').textContent);
      const display = snapshot.display_ja;
      const make = (tag, value = '', className = '') => {
        const node = document.createElement(tag);
        node.textContent = value;
        node.className = className;
        return node;
      };
      const stateNames = {
        active: '活動中',
        idle: '待機中',
        notLoaded: '未読込',
        systemError: 'システムエラー',
        unavailable: '確認不能',
        unknown: '不明',
        'not a session owner': 'セッション以外の担当者',
        open: '未完了',
        in_progress: '進行中',
        closed: '管理上の完了',
        blocked: '着手待ち',
        deferred: '保留',
        running: '実行中（子プロセス確認済み）',
        preparing: '準備中',
        unconfirmed: '未確認',
        'recovery needed': '復旧が必要',
        'command finished': 'コマンド終了',
        'command failed': 'コマンド失敗',
        'command cancelled': 'コマンド取消',
        'command timed_out': 'コマンド時間超過',
        'command not_started': 'コマンド未開始',
        paused: '人間の指示で一時停止',
        waiting: '待機中',
        none: '待機なし',
        human_decision: '人間の判断待ち',
        dependency: '依存タスク待ち',
        resource: '資源待ち',
        review: 'レビュー待ち',
        verification: '検証待ち',
        owner: '担当者待ち',
      };
      const stateName = (code) => stateNames[code] || '未記入／確認不能';
      const badge = (code) =>
        make(
          'span',
          stateName(code),
          'badge ' +
            ({
              running: 'running',
              active: 'active',
              paused: 'paused',
              waiting: 'waiting',
              unavailable: 'error',
              'recovery needed': 'error',
              systemError: 'error',
            }[code] || ''),
        );
      const date = (value) => {
        if (!value || !Number.isFinite(Date.parse(value))) return '未記入／確認不能';
        return (
          new Intl.DateTimeFormat('ja-JP', {
            timeZone: 'Asia/Tokyo',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hourCycle: 'h23',
          }).format(new Date(value)) + '（日本時間）'
        );
      };
      const field = (container, label, value) =>
        container.append(make('dt', label), make('dd', value));
      const original = (container, value) => {
        const detail = make('details', '', 'original');
        detail.append(
          make('summary', '原文・ID・内部コードを確認'),
          make('pre', JSON.stringify(value, null, 2)),
        );
        container.append(detail);
      };
      const showPath = (container, value) => {
        const row = make('div', '', 'path');
        const input = make('input');
        input.readOnly = true;
        input.value = value;
        input.setAttribute('aria-label', '証拠・runtimeの元の絶対パス');
        const copy = make('button', 'パスをコピー');
        copy.type = 'button';
        copy.addEventListener('click', async () => {
          input.select();
          try {
            await navigator.clipboard.writeText(value);
            document.getElementById('copy-status').textContent = 'パスをコピーしました。';
          } catch {
            document.getElementById('copy-status').textContent =
              'パスを選択しました。表示された文字列を手動でコピーしてください。';
          }
        });
        row.append(input, copy);
        container.append(row);
      };
      const warningNames = {
        metadata_unavailable: '表示用metadataを確認できません。',
        invalid_paths: 'パスのmetadataが不正なためruntimeを確認できません。',
        duplicate_root: '重複するruntimeの参照を省略しました。',
        runtime_unavailable: 'runtimeの記録を確認できません。',
        identity_unavailable: '子プロセスの識別を確認できず、実行中のジョブは確定していません。',
        thread_unavailable: '実際のセッション状態を確認できません。',
      };
      const snapshotAge = () => {
        const elapsed = Date.now() - Date.parse(snapshot.generated_at);
        if (!Number.isFinite(elapsed) || elapsed < 0) return '経過時間は未確認';
        const minutes = Math.floor(elapsed / 60000);
        if (minutes < 1) return '生成から1分未満';
        if (minutes < 60) return '生成から' + minutes + '分';
        const hours = Math.floor(minutes / 60);
        if (hours < 24) return '生成から' + hours + '時間';
        return '生成から' + Math.floor(hours / 24) + '日';
      };
      document.getElementById('timestamp').textContent =
        '生成日時：' +
        date(snapshot.generated_at) +
        ' ／ ' +
        snapshotAge() +
        '。現在の状態は未確認です。';
      document.getElementById('loaded-at').textContent =
        'ファイル読込日時：' +
        date(new Date().toISOString()) +
        '。再読み込みは生成済みHTMLを読むだけです。最新情報の収集には手動生成が必要です。';
      document.getElementById('translation-status').textContent =
        '翻訳待ち ' + display.pending + '項目。該当箇所は英語原文を表示し、詳細で確認できます。';
      if (display.cache_warning)
        document
          .getElementById('warnings')
          .append(
            make(
              'li',
              '日本語キャッシュを確認できません。原文に対応する日本語説明の更新を待っています。',
            ),
          );
      for (const [key, label] of [
        ['running_jobs', '確認済みの実行ジョブ'],
        ['waiting_issues', '待機中のタスク'],
        ['human_decisions', '人間の判断待ち'],
      ]) {
        const card = make('div', '', 'count');
        card.append(make('strong', String(snapshot.counts[key])), make('span', label));
        document.getElementById('counts').append(card);
      }
      for (const warning of snapshot.warning_details) {
        const row = make(
          'li',
          (warning.reference ? warning.reference + '：' : '') +
            (warningNames[warning.code] || '情報源を確認できません。'),
        );
        original(row, warning.original);
        document.getElementById('warnings').append(row);
      }
      const resultText = (job) => {
        const fixed = {
          not_supplied: '結果は未記入です。',
          identity_confirmed: '収集時点で子プロセスの正確な識別を確認しました。',
          identity_unconfirmed: '実行中という記録に一致する子プロセスを現在確認できません。',
          boundary_inconsistent: '状態と結果の対応が欠けているか、一致しません。',
          runtime_unavailable: 'runtimeの記録を検証できません。',
        };
        if (job.result_code !== 'controller_outcome')
          return fixed[job.result_code] || '結果は未確認です。';
        const outcomes = {
          succeeded: '正常終了',
          failed: '失敗',
          cancelled: '取消',
          timed_out: '時間超過',
          not_started: '未開始',
          unconfirmed: '未確認',
        };
        return (
          'コントローラーの結果：' +
          (outcomes[job.outcome] || '未確認（原文参照）') +
          ' ／ 終了コード：' +
          (Number.isInteger(job.exit_code) ? job.exit_code : '不明') +
          '。研究結果の成功はここでは判定しません。' +
          (job.cleanup_unconfirmed ? ' プロセス回収は未完了または不明です。' : '')
        );
      };
      const pendingText = '日本語説明の更新待ち';
      const missingText = '未記入／確認不能';
      const shown = (issue, key) => {
        const translated = display.issues[issue.id]?.[key];
        return translated && translated !== pendingText && translated !== missingText
          ? translated
          : issue[key] || missingText;
      };
      const ownerName = (group) => {
        const translated = display.owner_names[group.owner];
        return translated && translated !== pendingText && translated !== missingText
          ? translated
          : group.name_supplied
            ? group.name
            : group.owner;
      };
      const waitText = (issue) =>
        issue.paused && !issue.source_fields.includes('wait_reason')
          ? '人間の指示で一時停止'
          : shown(issue, 'wait_reason');
      const confirmedJobIssue = (group) =>
        group.issues
          .flatMap((issue) =>
            issue.jobs
              .filter((job) => job.status === 'running')
              .map((job) => ({ issue, sourceAt: job.source_at })),
          )
          .sort(
            (a, b) => b.sourceAt.localeCompare(a.sourceAt) || a.issue.id.localeCompare(b.issue.id),
          )[0]?.issue;
      const activity = (group, issue) => {
        const jobIssue = confirmedJobIssue(group);
        if (jobIssue)
          return (
            '生成時に計算ジョブの子プロセスを確認 [' +
            jobIssue.id +
            (jobIssue.status === 'closed' ? '・管理上は完了' : '') +
            ']'
          );
        if (!issue) return '現在の活動は未確認';
        if (issue.paused) return '人間の指示で一時停止';
        if (issue.wait_kind === 'human_decision') return '人間の判断待ち';
        if (issue.wait_kind === 'review') return 'レビュー待ち';
        if (
          issue.wait_kind === 'dependency' ||
          issue.dependencies.some(
            (dependency) =>
              dependency.status !== 'closed' &&
              ['blocks', 'conditional-blocks', 'waits-for'].includes(dependency.type),
          )
        )
          return '依存タスク待ち';
        if (issue.waiting)
          return issue.source_fields.includes('wait_reason')
            ? '待機理由を記録（詳細を参照）'
            : '待機・保留の記録あり · 理由未確認';
        if (issue.status === 'in_progress')
          return issue.source_fields.includes('stage')
            ? 'Beads記録上は進行中 · 段階「' + shown(issue, 'stage') + '」'
            : 'Beads記録上は進行中 · 活動内容は未確認';
        return '活動内容は未確認';
      };
      const section = (heading) => {
        const node = make('section', '', 'detail-section');
        node.append(make('h3', heading));
        return node;
      };
      const addIssue = (container, issue) => {
        const article = make('article', '', 'issue');
        article.append(make('h3', shown(issue, 'title')), badge(issue.status));
        if (issue.paused) article.append(badge('paused'));
        if (issue.waiting)
          article.append(badge(issue.wait_kind === 'Not supplied' ? 'waiting' : issue.wait_kind));
        const facts = make('dl');
        field(facts, '現在の段階', shown(issue, 'stage'));
        field(facts, '次の作業', shown(issue, 'next_action'));
        field(facts, '待機理由', waitText(issue));
        field(facts, '待機の種類', stateName(issue.wait_kind));
        field(facts, 'タスク更新日時', date(issue.updated_at));
        if (issue.status === 'closed') {
          field(facts, '管理上の完了理由（研究結果とは別）', shown(issue, 'close_reason'));
          field(facts, '管理上の完了日時', date(issue.closed_at));
        }
        field(
          facts,
          '依存タスク',
          issue.dependencies.length
            ? issue.dependencies
                .map(
                  (dependency) =>
                    (display.issues[dependency.id]?.title === pendingText
                      ? dependency.title
                      : display.issues[dependency.id]?.title || dependency.title) +
                    ' · ' +
                    stateName(dependency.status) +
                    ' [' +
                    dependency.id +
                    ']',
                )
                .join('\n')
            : '記録なし',
        );
        article.append(facts);
        for (const job of [...issue.jobs].sort((a, b) => b.source_at.localeCompare(a.source_at))) {
          const boundary = make('div', '', 'job');
          boundary.append(
            badge(job.status),
            make('p', resultText(job)),
            make(
              'p',
              '情報源のファイル日時：' +
                date(job.source_at) +
                (job.finished_at ? ' ／ コントローラー終了日時：' + date(job.finished_at) : ''),
              'muted',
            ),
          );
          showPath(boundary, job.root);
          article.append(boundary);
        }
        article.append(make('span', '証拠の元のパス（表示・コピーのみ）', 'label'));
        if (!issue.evidence_paths.length) article.append(make('p', '未記入／確認不能', 'muted'));
        for (const path of issue.evidence_paths) showPath(article, path);
        original(article, issue);
        container.append(article);
      };
      const dialog = document.getElementById('session-dialog');
      const dialogContent = document.getElementById('dialog-content');
      let returnFocus = null;
      const openDetail = (group, row) => {
        const primary = group.issues.find((issue) => issue.id === group.primary_issue_id);
        const unresolved = group.issues.filter(
          (issue) => issue.status !== 'closed' && issue !== primary,
        );
        const completed = group.issues.filter((issue) => issue.status === 'closed');
        document.getElementById('dialog-title').textContent = ownerName(group);
        dialogContent.replaceChildren();
        const current = section('現在のタスク・状態');
        current.append(
          make('p', '未完了のタスク：計' + (unresolved.length + (primary ? 1 : 0)) + '件'),
        );
        current.append(make('p', '活動判定：' + activity(group, primary)));
        const jobIssue = confirmedJobIssue(group);
        if (jobIssue && jobIssue !== primary)
          current.append(
            make(
              'p',
              '確認された計算ジョブの記録元：' +
                shown(jobIssue, 'title') +
                ' [' +
                jobIssue.id +
                ']。詳細は下の該当タスクにあります。',
            ),
          );
        if (primary) addIssue(current, primary);
        else current.append(make('p', '現在の未完了タスクはありません。'));
        dialogContent.append(current);
        const more = section('その他の未完了タスク（' + unresolved.length + '件）');
        for (const issue of unresolved) addIssue(more, issue);
        dialogContent.append(more);
        const identity = section('原文・セッション識別');
        identity.append(
          make(
            'p',
            'LLM状態：' +
              stateName(group.llm) +
              ' ／ 読取日時：' +
              date(group.llm_source_at) +
              '。この状態だけから計算や作業の進行は判断しません。',
          ),
        );
        original(identity, {
          owner: group.owner,
          name: group.name,
          llm: group.llm,
          llm_source_at: group.llm_source_at,
          primary_issue_id: group.primary_issue_id,
        });
        dialogContent.append(identity);
        const history = section('完了した履歴（' + completed.length + '件）');
        for (const issue of completed) addIssue(history, issue);
        dialogContent.append(history);
        returnFocus = row;
        dialog.showModal();
        document.getElementById('dialog-close').focus();
      };
      document.getElementById('dialog-close').addEventListener('click', () => dialog.close());
      dialog.addEventListener('close', () => {
        if (returnFocus?.isConnected && !returnFocus.hidden) returnFocus.focus();
        else document.getElementById('search').focus();
      });
      const owners = [];
      for (const group of snapshot.groups) {
        const primary = group.issues.find((issue) => issue.id === group.primary_issue_id);
        const row = make('button', '', 'owner-row');
        row.type = 'button';
        row.setAttribute('aria-haspopup', 'dialog');
        row.setAttribute('aria-label', ownerName(group) + ' の詳細を開く');
        row.append(
          make('span', ownerName(group), 'owner-name'),
          make('span', activity(group, primary)),
          make('span', primary ? shown(primary, 'title') : '現在の未完了タスクなし'),
          make(
            'span',
            primary
              ? primary.waiting
                ? '待機：' + waitText(primary)
                : shown(primary, 'next_action')
              : '次の作業は未記入',
          ),
        );
        row.addEventListener('click', () => openDetail(group, row));
        document.getElementById('owners').append(row);
        owners.push({ row, group });
      }
      function filter() {
        const query = document.getElementById('search').value.trim().toLowerCase();
        const waiting = document.getElementById('waiting').checked;
        let visible = 0;
        for (const { row, group } of owners) {
          const matches = group.issues.some(
            (issue) =>
              (!waiting || issue.waiting) &&
              [
                group.owner,
                group.name,
                display.owner_names[group.owner],
                issue.id,
                issue.title,
                issue.stage,
                issue.next_action,
                issue.wait_reason,
                ...Object.values(display.issues[issue.id]),
              ]
                .join(' ')
                .toLowerCase()
                .includes(query),
          );
          row.hidden = !matches;
          if (matches) visible += 1;
        }
        document.getElementById('empty').hidden = visible !== 0;
      }
      document.getElementById('search').addEventListener('input', filter);
      document.getElementById('waiting').addEventListener('change', filter);
      document.getElementById('reload').addEventListener('click', () => location.reload());
      filter();
    </script>
  </body>
</html>
