[package]
name = "quoridor-data"
version = "0.1.0"
edition = "2024"
[dependencies]
quoridor-core = { path = "../quoridor-core", features = ["research"] }
quoridor-nnue = { path = "../quoridor-nnue" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
arrow2 = { version = "0.18", features = ["io_ipc", "io_ipc_compression"] }
[lib]
crate-type = ["rlib", "cdylib"]
