[package]
name = "quoridor-inference"
version = "0.1.0"
edition = "2024"
build = "build.rs"
[lib]
crate-type = ["rlib", "cdylib"]
[features]
default = []
claustrophobia = ["dep:claustrophobia-upstream"]
cuda-aoti = []
tensorrt = []
[dependencies]
claustrophobia-upstream = { package = "quoridor", git = "https://github.com/Plaaasma/Claustrophobia", rev = "ae093653e62ad700e201706fa5ed767093d0d68e", default-features = false, optional = true }
sha2 = "0.10.9"
serde_json = "1.0.151"
[build-dependencies]
cc = "1.5.1"
[dev-dependencies]
serde_json = "1.0.151"
quoridor-core = { path = "../quoridor-core", features = ["research"] }

[[example]]
name = "faults"
required-features = ["cuda-aoti", "tensorrt"]
