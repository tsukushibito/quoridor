[package]
name = "quoridor-ai"
version = "0.1.0"
edition = "2024"
[dependencies]
quoridor-core = { path = "../quoridor-core" }
quoridor-nnue = { path = "../quoridor-nnue", optional = true }
web-time = "1"

[features]
profiling = ["quoridor-core/profiling"]
research = ["quoridor-core/research", "dep:quoridor-nnue", "quoridor-nnue/research"]
research-diagnostics = ["research", "quoridor-core/research-diagnostics"]

[dev-dependencies]
serde_json = "1"
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "nnue_search"
harness = false
required-features = ["research"]
